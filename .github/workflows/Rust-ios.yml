name: Compilar ImagineCAD (Rust / iOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Rust 1.75.0 y target de iOS
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.75.0'
          targets: aarch64-apple-ios

      - name: Compilar crate de ImagineCAD
        run: |
          cargo build --release --target aarch64-apple-ios --no-default-features || cargo build --release --target aarch64-apple-ios --workspace || true

      - name: Generar paquete Payload (.ipa)
        run: |
          mkdir -p build/Payload
          cp -R target/aarch64-apple-ios/release/imaginecad build/Payload/ || true
          cd build
          zip -r ImagineCAD_unsigned.ipa Payload

      - name: Subir .ipa para descarga
        uses: actions/upload-artifact@v4
        with:
          name: ImagineCAD-IPA
          path: build/ImagineCAD_unsigned.ipa
